<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>리디 클론</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/header.css" />
  </head>
  <body>
    <header>
      <div id="header_top">
        <div class="container">
          <div id="logo">로고</div>
          <div id="right_group">
            <div id="search_box"><input type="text" /></div>
            <div id="login">
              <a href="#">로그인/회원가입</a>
            </div>
          </div>
        </div>
      </div>

      <div id="header_main">
        <div class="container">
          <div id="category">
            <div id="category_left">
              <nav>
                <ul>
                  <li><a href="#">웹툰</a></li>
                  <li><a href="#">만화</a></li>
                  <li><a href="#">웹소설</a></li>
                  <li><a href="#">도서</a></li>
                  <li><a href="#">셀렉트</a></li>
                </ul>
              </nav>
            </div>
            <div id="category_right">
              <div id="full_category"><a href="#">전체카테고리</a></div>
              <div id="cash"><a href="#">캐쉬충전</a></div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div id="main_content">
        <div class="container">
          <div id="book_category">
            <nav>
              <ul>
                <li class="active"><a href="#">추천</a></li>
                <li><a href="#">기획전</a></li>
                <li><a href="#">소설</a></li>
                <li><a href="#">인문/사회/역사</a></li>
                <li><a href="#">경영/경제</a></li>
                <li><a href="#">에세이/시</a></li>
                <li><a href="#">자기계발</a></li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
      <section id="main_banner" class="common-slider-section">
        <div class="container">
          <div class="swiper mySwiper">
            <div class="swiper-wrapper">
              <div class="swiper-slide">Slide 1</div>
              <div class="swiper-slide">Slide 2</div>
              <div class="swiper-slide">Slide 3</div>
              <div class="swiper-slide">Slide 4</div>
              <div class="swiper-slide">Slide 5</div>
              <div class="swiper-slide">Slide 6</div>
            </div>
          </div>
          <div class="swiper-button-next main-next">
            <i class="fa-solid fa-arrow-right"></i>
          </div>
          <div class="swiper-button-prev main-prev">
            <i class="fa-solid fa-arrow-left"></i>
          </div>
        </div>
      </section>
      <nav id="icon_nav" class="container">
        <ul>
          <li><a href="#">1</a></li>
          <li><a href="#">2</a></li>
          <li><a href="#">3</a></li>
          <li><a href="#">4</a></li>
          <li><a href="#">5</a></li>
          <li><a href="#">6</a></li>
          <li><a href="#">7</a></li>
          <li><a href="#">8</a></li>
        </ul>
      </nav>
      <section class="common-slider-section">
        <div class="container">
          <h2>지금 많이 읽고 있는 작품</h2>
        </div>
        <div class="container">
          <div class="swiper nowrankingSwiper">
            <div class="swiper-wrapper" id="nowranking-list"></div>
          </div>
          <div class="swiper-button-next ranking-next">
            <i class="fa-solid fa-arrow-right"></i>
          </div>
          <div class="swiper-button-prev ranking-prev">
            <i class="fa-solid fa-arrow-left"></i>
          </div>
        </div>
      </section>

      <section class="common-slider-section">
        <div class="container">
          <h2>오늘, 리디의 발견</h2>
        </div>
        <div class="container">
          <div class="swiper discoverSwiper">
            <div class="swiper-wrapper" id="discover-list"></div>
          </div>
          <div class="swiper-button-next discover-next">
            <i class="fa-solid fa-arrow-right"></i>
          </div>
          <div class="swiper-button-prev discover-prev">
            <i class="fa-solid fa-arrow-left"></i>
          </div>
        </div>
      </section>

      <section>
        <div class="container"></div>
      </section>
    </main>

    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
